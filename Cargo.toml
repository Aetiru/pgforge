[workspace]
resolver = "2"
members = ["crates/pgforge-core", "crates/pgforge-cli", "src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["pgforge contributors"]
repository = "https://github.com/pgforge/pgforge"

[workspace.dependencies]
pgforge-core = { path = "crates/pgforge-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Sin `panic = "abort"` a propósito, aunque achique el binario: acá los panics no pasan en el hilo
# principal sino adentro de tareas de tokio —el sondeo del dashboard, una ejecución de consulta—, y
# abortar convierte cualquiera de ellos en la ventana cerrándose sola, con el SQL sin guardar
# adentro. Que se desenrolle deja muerta la tarea y viva la aplicación.
