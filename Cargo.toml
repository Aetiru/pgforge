[workspace]
resolver = "2"
members = ["crates/pgforge-core", "crates/pgforge-cli", "src-tauri"]

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["pgforge contributors"]
# El repositorio de verdad, no un nombre de fantasía: de acá sale la dirección con la que el aviso de
# versión nueva le pregunta a la API de releases (`pgforge_core::update`).
repository = "https://github.com/Aetiru/pgforge"

[workspace.dependencies]
pgforge-core = { path = "crates/pgforge-core" }

# La información de depuración completa de un workspace con Tauri adentro son decenas de gigabytes de
# `.pdb` en `target/debug`, y se pagan enteros para leer un backtrace. Con las tablas de líneas alcanza
# para saber archivo y línea de cada cuadro; lo que se pierde es inspeccionar variables paso a paso en
# un depurador, que acá se usa mucho menos seguido que quedarse sin disco.
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# Sin `panic = "abort"` a propósito, aunque achique el binario: acá los panics no pasan en el hilo
# principal sino adentro de tareas de tokio —el sondeo del dashboard, una ejecución de consulta—, y
# abortar convierte cualquiera de ellos en la ventana cerrándose sola, con el SQL sin guardar
# adentro. Que se desenrolle deja muerta la tarea y viva la aplicación.
