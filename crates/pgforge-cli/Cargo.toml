[package]
name = "pgforge-cli"
description = "Interfaz de línea de comandos de pgforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "pgforge"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.61", features = ["derive"] }
pgforge-core.workspace = true
# `signal` deja que `pgforge tunnel` espere Ctrl-C para cerrar el forward de forma ordenada.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal"] }
