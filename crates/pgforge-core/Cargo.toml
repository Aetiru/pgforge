[package]
name = "pgforge-core"
description = "Núcleo de pgforge: conexión, introspección y administración de PostgreSQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Nada de esto se publica en crates.io: la aplicación se distribuye como instalador. Decirlo evita
# un `cargo publish` por accidente y deja que las cajas del workspace se pidan por ruta.
publish = false

[dependencies]
bytes = "1.10.1"
deadpool-postgres = "0.14.1"
futures-util = { version = "0.3.33", default-features = false, features = ["std", "sink"] }
keyring = { version = "3.6.3", features = ["apple-native", "sync-secret-service", "windows-native"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.15.1"
# Túnel SSH en Rust puro. Se usa el backend `ring` (el mismo que rustls en este crate) en vez del
# `aws-lc-rs` por omisión: aws-lc-rs necesita NASM y cmake para compilar en Windows, y el CI corre en
# las tres plataformas. `flate2` habilita la compresión que ofrecen muchos bastiones; `rsa` cubre las
# claves RSA, todavía comunes en servidores heredados.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
tokio-postgres = "0.7.13"
tokio-postgres-rustls = "0.14.0"
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
