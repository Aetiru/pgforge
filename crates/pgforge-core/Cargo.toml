[package]
name = "pgforge-core"
description = "Núcleo de pgforge: conexión, introspección y administración de PostgreSQL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
deadpool-postgres = "0.14.1"
keyring = { version = "3.6.3", features = ["apple-native", "sync-secret-service", "windows-native"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.4"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-postgres = "0.7.13"
tokio-postgres-rustls = "0.14.0"
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
