name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # El núcleo y la CLI se prueban contra **todas** las versiones de PostgreSQL del rango soportado:
  # si el gating por versión está mal, falla acá y no en la máquina de un usuario. Los extremos
  # atrapan lo que se rompe al salir del rango; las del medio, el salto de catálogo que quedó atado
  # a una versión intermedia y que 13 y 17 no distinguen.
  core:
    name: core (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: pgforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # `keyring` usa el Secret Service en Linux, que habla D-Bus: sin la cabecera, `libdbus-sys` ni
      # siquiera compila. El job de escritorio no lo necesita porque `libwebkit2gtk-4.1-dev` ya la
      # arrastra; este solo compila el núcleo, así que la pide él.
      - name: Dependencias de sistema
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formato
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy -p pgforge-core -p pgforge-cli --all-targets

      - name: Tests
        run: cargo test -p pgforge-core -p pgforge-cli
        env:
          PGFORGE_TEST_URLS: postgres://postgres:pgforge@localhost:5432/postgres

  # Lo que ningún test contesta: si alguna dependencia tiene una vulnerabilidad publicada, si alguna
  # trae una licencia que no se puede distribuir, y si alguna sale de un registro que no es
  # crates.io. Las reglas están en `deny.toml`. Va en un job aparte porque no compila nada: solo lee
  # `Cargo.lock`, así que tarda segundos y no depende de la matriz de PostgreSQL.
  dependencias:
    name: dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  ui:
    name: interfaz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ui:check
      - run: pnpm ui:test
      - run: pnpm ui:build

  # Verifica que la aplicación compila en las tres plataformas y, en una sola, que sus comandos de
  # vista previa traducen bien lo que manda la interfaz. No genera instaladores: eso es trabajo del
  # workflow de release.
  desktop:
    name: escritorio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de sistema (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle

      # Los tests de `src-tauri` son puros —no tocan la red ni la ventana—, así que correrlos en las
      # tres plataformas no agregaría nada. Van después del build porque `generate_context!` exige
      # que exista `ui/dist`, y el build es quien lo genera.
      - name: Vista previa e IPC (tests puros)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cargo clippy -p pgforge-app --all-targets
          cargo test -p pgforge-app
