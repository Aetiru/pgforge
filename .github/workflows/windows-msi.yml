name: Instalador de Windows

# Empaqueta solo Windows y sube los instaladores como artefacto, **sin crear ningún release**. Existe
# para comprobar antes de poner un tag si el MSI acepta la versión (WiX exige que el prerelease sea
# numérico, y `0.13.0-rc.1` puede no serlo) y para tener el `.exe` a mano. Corre al empujar una rama
# `release/**` o a mano.
on:
  push:
    branches: ["release/**"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Un paquete por vez: si el MSI falla, el de NSIS se sigue intentando y se ve cuál de los dos es.
      - name: MSI
        id: msi
        continue-on-error: true
        run: pnpm tauri build --bundles msi
      - name: NSIS
        id: nsis
        continue-on-error: true
        run: pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: pgforge-windows
          path: |
            target/release/pgforge-app.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: warn

      - name: Resultado
        run: |
          echo "msi: ${{ steps.msi.outcome }}"
          echo "nsis: ${{ steps.nsis.outcome }}"
          if ("${{ steps.msi.outcome }}" -ne "success") { exit 1 }
