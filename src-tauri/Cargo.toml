[package]
name = "pgforge-app"
description = "Aplicación de escritorio de pgforge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Nada de esto se publica en crates.io: la aplicación se distribuye como instalador. Decirlo evita
# un `cargo publish` por accidente y deja que las cajas del workspace se pidan por ruta.
publish = false

[lib]
name = "pgforge_app_lib"
# Solo escritorio: los tipos cdylib/staticlib que agrega la plantilla de Tauri son para las
# plataformas móviles y acá solo aportan tiempo de compilación y ruido del linker.
crate-type = ["lib"]

[dependencies]
pgforge-core.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.11.5", features = [] }
# Para elegir dónde guardar un backup. El selector nativo del sistema, no uno dibujado por la
# interfaz: es un archivo de verdad y el usuario espera su explorador de archivos.
tauri-plugin-dialog = "2.4.1"
# Registro a archivo. Un error que se muestra y se cierra no deja rastro: sin esto, «me falló al
# conectar» no se puede diagnosticar después.
tauri-plugin-log = "2.8.1"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
tokio-postgres = "0.7.18"
uuid = { version = "1.24.0", features = ["v4"] }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
# Los tests de vista previa arman la carga JSON tal como la manda la interfaz, en vez de construir
# los tipos de Rust: así lo que se verifica es también el contrato de serde con `ipc.ts`.
serde_json = "1.0.145"
